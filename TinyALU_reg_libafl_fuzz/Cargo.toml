[package]
name = "tinyalu_reg_libafl_fuzz"
version = "0.1.0"
edition = "2024"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3
debug = true

[dependencies]
libafl = { path = "../LibAFL/crates/libafl" }
libafl_bolts = { path = "../LibAFL/crates/libafl_bolts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
