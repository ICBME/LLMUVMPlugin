name = "tinyalu"
toplevel = "tinyalu"
driver = "fuzz_bfm.tinyalu_driver:TinyAluDriver"
schema = "semantic JSONL: target,a,b,op,origin"

[[field]]
name = "a"
kind = "int"
min = 0
max = 255

[[field]]
name = "b"
kind = "int"
min = 0
max = 255

[[field]]
name = "op"
kind = "int"
min = 1
max = 4
choices = [1, 2, 3, 4]
