name = "sha256"
toplevel = "sha256"
clock = "clk"
clock_period_ns = 1.0
reset = "reset_n"
driver = "fuzz_bfm.sha256_driver:Sha256Driver"
ref_model = "fuzz_uvm.llm_ref_models:Sha256RefModel"
scoreboard = "fuzz_uvm.scoreboards:ResultScoreboard"
coverage_model = "fuzz_uvm.functional_coverage:Sha256CoverageModel"
bus = "secworks memory-mapped cs/we/address/write_data/read_data"
schema = "semantic JSONL: target,mode,message,origin"

[signals]
clk = "clk"
reset_n = "reset_n"
cs = "cs"
we = "we"
address = "address"
write_data = "write_data"
read_data = "read_data"

[[field]]
name = "mode"
kind = "enum"
choices = ["sha224", "sha256"]

[[field]]
name = "message"
kind = "hex"
