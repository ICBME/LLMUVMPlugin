name = "aes"
toplevel = "aes"
clock = "clk"
clock_period_ns = 1.0
reset = "reset_n"
driver = "fuzz_bfm.aes_driver:AesDriver"
ref_model = "fuzz_uvm.llm_ref_models:AesRefModel"
scoreboard = "fuzz_uvm.scoreboards:ResultScoreboard"
coverage_model = "fuzz_uvm.functional_coverage:AesCoverageModel"
bus = "secworks memory-mapped cs/we/address/write_data/read_data"
schema = "semantic JSONL: target,key_len,encdec,key,block,origin"

[signals]
clk = "clk"
reset_n = "reset_n"
cs = "cs"
we = "we"
address = "address"
write_data = "write_data"
read_data = "read_data"

[[field]]
name = "key_len"
kind = "int"
min = 128
max = 256
choices = [128, 256]

[[field]]
name = "encdec"
kind = "enum"
choices = ["encipher", "decipher"]

[[field]]
name = "key"
kind = "hex"
hex_len_by = { key_len = { "128" = 16, "256" = 32 } }

[[field]]
name = "block"
kind = "hex"
hex_len = 16
