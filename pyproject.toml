[project]
name = "rtlagent-pyuvm"
version = "0.1.0"
readme = "README.md"
requires-python = "<3.14, >3.11"
dependencies = [
    "hypothesis>=6.155.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "langsmith>=0.1.0",
    "pyuvm>=4.0.1",
    "socksio>=1.0.0",
]

[project.scripts]
rtlagent-codegen = "rtlagent_bfm.codegen.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
    "LLMPlugin*",
    "Spec2Backend*",
    "rtlagent_bfm*",
]
